name: Daily Valet API ingestion

on:
  schedule:
    # 13:00 UTC = 8:00/9:00 ET depending on DST — after Valet's typical
    # publish window, well before CORRA's 9:00-11:00 ET publish window closes.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r ingestion/requirements.txt

      - name: Pull Valet API and land into Databricks bronze volume
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_VOLUME_PATH: ${{ secrets.DATABRICKS_VOLUME_PATH }}
        run: python -m ingestion.pull_series

      - name: Upload run log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-failure-log
          path: "*.log"
          if-no-files-found: ignore
