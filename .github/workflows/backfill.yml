name: One-time historical backfill

# Manual only, run once before the first `dbt build` so the backfill files
# exist before land_bronze_files() tries to read them. Safe to re-run later.
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Backfill start date (YYYY-MM-DD). Leave blank to use ingestion/config.py's BACKFILL_START_DATE."
        required: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r ingestion/requirements.txt

      - name: Backfill historical data into Databricks bronze volume
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_VOLUME_PATH: ${{ secrets.DATABRICKS_VOLUME_PATH }}
          BACKFILL_START_DATE: ${{ github.event.inputs.start_date }}
        run: python -m ingestion.backfill
