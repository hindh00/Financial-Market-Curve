name: "financial_market_curve"
version: "1.0.0"
config-version: 2

profile: "financial_market_curve"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Single source of truth for the Unity Catalog catalog name.
  catalog_name: "financial_market_curve"

  # Must stay in sync with ingestion/config.py's BACKFILL_START_DATE, or
  # backfilled rows before it fail the referential-integrity DQ check.
  backfill_start_date: "{{ env_var('BACKFILL_START_DATE', '2017-01-01') }}"

  # >4 std-dev (robust) jump threshold, consumed by dq_jump_check.sql.
  jump_threshold_std: 4.0

  # Benchmark-switch heuristic: a tenor's daily yield change (percentage
  # points, so 0.15 = 15bps) must exceed this AND be >3x that day's median
  # move to be flagged as a likely bond roll rather than a market move.
  benchmark_switch_abs_threshold: 0.15

models:
  financial_market_curve:
    silver:
      +materialized: view
      +schema: silver
    gold:
      +materialized: table
      +schema: gold

seeds:
  financial_market_curve:
    +schema: silver
    dim_policy_event_seed:
      +column_types:
        decision_date: date
        size_bps: int
        has_mpr: boolean
    canadian_holidays_seed:
      +column_types:
        holiday_date: date
    series_registry_seed:
      +schema: silver
